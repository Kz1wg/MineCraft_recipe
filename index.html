<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="レシピ図鑑">
<meta name="description" content="Minecraft Bedrock Editionのレシピを検索できるiPhone向け図鑑">
<title>マイクラ レシピ図鑑</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{color-scheme:dark;--bg:#101812;--head:#243b2b;--panel:#1b2a20;--panel2:#26392b;--line:#3d5942;--text:#f3f7f0;--muted:#b6c5b5;--accent:#a4d58d;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
/* ステータスバー裏を塗りつぶす（スタンドアロン起動時の透過対策） */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--sat);background:var(--head);z-index:40}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

.top{padding:calc(10px + var(--sat)) 14px 8px;background:var(--head);display:flex;align-items:center;justify-content:space-between;gap:10px}
.topright{display:flex;align-items:center;gap:8px;min-width:0}
.langbtn{flex:0 0 auto;border:1px solid var(--line);background:#0e1711;border-radius:999px;padding:5px 10px;font-size:11.5px;color:var(--text);white-space:nowrap}
h1{font-size:17px;margin:0;white-space:nowrap}
.sub{font-size:10.5px;color:#c4d4c1;text-align:right;line-height:1.35}

/* 画面上部に固定される検索バー */
.toolbar{position:sticky;top:var(--sat);z-index:30;background:var(--head);border-bottom:1px solid var(--line);padding:2px 12px 0;box-shadow:0 5px 12px rgba(0,0,0,.35)}
.searchrow{display:flex;gap:8px;align-items:stretch}
.searchbox{position:relative;flex:1;min-width:0}
.searchbox input{width:100%;background:#0e1711;border:1px solid var(--line);border-radius:12px;padding:11px 40px 11px 38px;font-size:16px;-webkit-appearance:none;appearance:none}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.searchbox input::-webkit-search-cancel-button,.searchbox input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:15px;opacity:.85}
.clearbtn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:16px;border-radius:50%}
.clearbtn[hidden]{display:none}
#station{width:auto;flex:0 0 auto;max-width:40%;background:#0e1711;border:1px solid var(--line);border-radius:12px;padding:0 8px;font-size:16px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -12px;padding:9px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:13px}
.chips button.active{background:var(--accent);border-color:var(--accent);color:#142116;font-weight:700}

main{max-width:820px;margin:auto;padding:10px 13px calc(30px + var(--sab))}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:2px 1px 9px;min-height:22px}
.link{border:0;background:none;color:var(--accent);font-size:12px;padding:4px 2px;text-decoration:underline}
.cards{display:grid;grid-template-columns:1fr;gap:8px}
.grouphead{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--accent);margin:10px 2px 0}
.grouphead:first-child{margin-top:0}
.recipe{display:flex;align-items:center;gap:11px;text-align:left;width:100%;min-height:62px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.recipe:active{background:var(--panel2)}
.icon{width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:23px}
.rbody{min-width:0;flex:1}
.rname{display:block;font-weight:700;font-size:15px;line-height:1.35}
.cnt{font-weight:400;font-size:12px;color:var(--accent);margin-left:5px}
.details{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.arrow{color:var(--muted);font-size:20px}
.morebtn{grid-column:1/-1;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:14px}
.empty{grid-column:1/-1;padding:26px 18px;text-align:center;color:var(--muted);background:var(--panel);border-radius:13px;line-height:1.7}
.empty .link{font-size:14px}
.notice{font-size:10px;color:var(--muted);line-height:1.65;margin:20px 2px 10px}
footer{font-size:10px;color:#91a18f;text-align:center;padding:8px}

/* 詳細ボトムシート */
.sheetroot{position:fixed;inset:0;z-index:100;display:none}
.sheetroot.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);animation:fade .18s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);animation:up .22s ease}
.sheetbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 2px;touch-action:none}
.grab{flex:1;display:grid;place-items:center;height:36px}
.grab span{width:42px;height:5px;border-radius:3px;background:#587a5e}
.sbtn{min-width:44px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:15px;padding:0 10px}
.sbtn:active{background:var(--panel2)}
.sbtn[hidden]{visibility:hidden;display:block}
.sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 16px calc(18px + var(--sab))}
.detailhead{display:flex;align-items:center;gap:12px}
.detailhead .icon{width:54px;height:54px;flex-basis:54px;font-size:29px}
h2{font-size:19px;margin:0;line-height:1.3}
.muted{color:var(--muted);font-size:12px;line-height:1.55}
.pills{margin-top:10px}
.pill{display:inline-block;padding:3px 8px;border-radius:6px;background:#314734;color:#d8ebd0;font-size:11px;margin:0 4px 4px 0}
.detailgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,150px);gap:14px;align-items:start;margin-top:14px}
.sec{font-size:13px;font-weight:700;margin:0 0 4px}
.ingredients{padding:0;margin:0;list-style:none}
.ing{display:flex;align-items:center;gap:7px;width:100%;padding:10px 0;border:0;border-bottom:1px solid #344a38;background:transparent;font-size:14px;line-height:1.4;text-align:left;border-radius:0}
.ing.static{cursor:default}
button.ing:active{background:var(--panel2)}
.iname{min-width:0;overflow-wrap:anywhere}
.iqty{color:var(--muted);white-space:nowrap}
.role{font-size:10px;padding:1px 6px;border-radius:5px;background:#34503a;color:#cfe6c7;white-space:nowrap}
.go{margin-left:auto;color:var(--accent);font-size:12px;white-space:nowrap}
.craftgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;aspect-ratio:1;background:#69765f;padding:5px;border-radius:10px}
.cell{background:#d8d0b7;color:#24251f;border-radius:5px;display:grid;place-items:center;text-align:center;font-size:clamp(9px,2.6vw,12px);font-weight:700;min-width:0;overflow-wrap:anywhere;padding:2px;line-height:1.2}
.cell.blank{background:#b5b09f}
.cell.opt{background:transparent;border:1.5px dashed #d8d0b7;color:#e8e2cf;font-weight:400}
.gridlabel{text-align:center;font-size:10px;color:var(--muted);margin-top:6px}
.flowbox{padding:14px 12px;background:var(--panel2);border-radius:10px;text-align:center;font-size:12px;line-height:1.6;color:var(--muted)}
.quick{grid-column:1/-1;margin-bottom:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--accent);margin:2px 2px 6px}
.qhead .link{font-weight:400;color:var(--muted)}
.qrow{display:flex;gap:7px;overflow-x:auto;margin:0 -13px;padding:0 13px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.qrow::-webkit-scrollbar{display:none}
.qitem{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px 7px 9px;font-size:13px;white-space:nowrap}
.qitem:active{background:var(--panel2)}
.favbtn{margin-left:auto;flex:0 0 auto;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:20px;color:var(--muted)}
.favbtn[aria-pressed="true"]{color:#ffd45c;border-color:#8a7a3c}
.notes{margin-top:14px}
.notes ul{margin:0;padding-left:1.2em;font-size:13px;line-height:1.65;color:var(--text)}
.notes li{margin-bottom:4px}
.vsec{margin-top:12px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.vchip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 12px;font-size:12.5px;line-height:1.3;text-align:left}
.vchip.active{background:var(--accent);border-color:var(--accent);color:#142116;font-weight:700}
.vcnt{display:inline-block;font-weight:700;font-size:10.5px;color:#142116;background:var(--accent);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.act{display:block;width:100%;margin-top:16px;padding:13px;border:1px solid var(--accent);border-radius:12px;background:transparent;color:var(--accent);font-size:14px;font-weight:700}
.act:active{background:rgba(164,213,141,.14)}
.act.sub2{border-color:var(--line);color:var(--text);font-weight:400;margin-top:8px;background:var(--panel2)}
.extlinks{display:grid;gap:6px;margin-top:8px}
.ext{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:12px;line-height:1.35;text-decoration:none}
.ext:active{background:#30463a}
.ilink{margin-left:auto;color:var(--accent);font-size:11.5px;white-space:nowrap;text-decoration:none;padding:4px 0 4px 8px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}.sheet{bottom:4vh;border-bottom:1px solid var(--line);border-radius:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1 id="appTitle">⛏ マイクラ レシピ図鑑</h1>
  <div class="topright"><div class="sub" id="version">統合版 / Bedrock</div><button class="langbtn" id="langBtn" type="button">English</button></div>
</header>

<div class="toolbar" id="toolbar">
  <div class="searchrow">
    <div class="searchbox">
      <span class="sicon" aria-hidden="true">🔍</span>
      <input id="search" type="search" placeholder="名前・材料で検索" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" inputmode="search" aria-label="アイテム名・材料名で検索">
      <button class="clearbtn" id="clear" type="button" aria-label="検索語を消す" hidden>✕</button>
    </div>
    <select id="station" aria-label="作業場所で絞り込み"><option value="">全作業場所</option></select>
  </div>
  <nav class="chips" id="filters" aria-label="カテゴリ"></nav>
</div>

<main>
  <div class="meta" id="meta"><span id="count" aria-live="polite">レシピを読み込み中…</span><span id="resetwrap"></span></div>
  <section class="cards" id="cards"></section>
  <p class="notice" id="notice"></p>
  <footer id="footer"></footer>
</main>

<div class="sheetroot" id="sheetRoot">
  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheetbar" id="sheetbar">
      <button class="sbtn" id="sheetBack" type="button" aria-label="前のレシピに戻る" hidden>‹ 戻る</button>
      <div class="grab" aria-hidden="true"><span></span></div>
      <button class="sbtn" id="sheetClose" type="button" aria-label="閉じる">✕</button>
    </div>
    <div class="sheetbody" id="sheetBody"></div>
  </section>
</div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const PAGE=100;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------------------------------------------------------- 言語（日本語 / English） */
// 端末の言語が日本語なら日本語、それ以外は英語。ボタンで手動切り替えした場合だけ保存した値を優先する
const LANGS=["ja","en"];
const LANG=(()=>{
  try{const s=localStorage.getItem("mcr.lang");if(LANGS.includes(s))return s;}catch(e){}
  const pref=((navigator.languages&&navigator.languages[0])||navigator.language||"").toLowerCase();
  return pref.startsWith("ja")?"ja":"en";
})();
const I18N={
  ja:{
    title:"マイクラ レシピ図鑑",appTitle:"⛏ マイクラ レシピ図鑑",edition:"統合版 / Bedrock",
    searchPh:"名前・材料で検索",searchAria:"アイテム名・材料名で検索",clearAria:"検索語を消す",
    stationAria:"作業場所で絞り込み",allStations:"全作業場所",catAria:"カテゴリ",loading:"レシピを読み込み中…",
    notice:"※ この図鑑はMojang公式のBedrockサンプルデータをもとに生成しています。クラフト・加工レシピの図鑑であり、ゲーム内の全アイテム一覧ではありません。ドロップ・取引・構造物からのみ入手するアイテムや、アドオン独自のレシピは表示されません。<br>レシピはゲームの更新で変更される場合があります。データ更新日とバージョンは右上に表示します。",
    footer:"非公式ファンツール。Minecraft は Mojang Studios / Microsoft の商標です。",
    back:"‹ 戻る",backAria:"前のレシピに戻る",closeAria:"閉じる",close:"閉じる",
    other:"その他",listSep:"、",nameSep:"・",stSep:"・",detailSep:" ／ ",etc:" ほか",colon:"：",numbered:"{t}（{n}）",
    fav:"★ お気に入り",recent:"🕘 最近見たレシピ",clear:"消す",allItems:"すべてのアイテム",
    groupMake:"「{q}」を作るレシピ（{n}）",groupUse:"「{q}」を材料などに使うレシピ（{n}）",
    ways:"{n}通り",special:"特殊",specialRecipe:"特殊レシピ",
    hits:"{n} 件ヒット",items:"{n} / {t} アイテム",reset:"条件をすべて解除",empty:"該当するレシピがありません。",
    more:"さらに表示（残り {n} 件）",
    gridLabel:"作業台の配置（上から見た図）",layoutLabel:"正面から見た図",
    flow_build:"ワールドにブロックを並べて作ります。下の「作り方のポイント」を参照",
    flow_shapeless:"配置自由<br>作業台の空いているマスに材料を置けばOK",flow_process:"{st}に材料を入れて加熱",
    flow_brewing:"醸造台で、ベースに材料を加えて醸造",flow_smithing:"鍛冶台に、テンプレート・ベース・素材をセット",
    flow_other:"専用の作業場所で加工",
    recipeLink:"レシピ ›",variantsHead:"作り方 {n}通り（タップで切り替え）",favAdd:"お気に入りに追加",favRemove:"お気に入りから外す",
    makes:"完成数：{n}",ingHead:"必要な材料・入力",noIng:"材料情報なし（特殊レシピ）",notesHead:"作り方のポイント",
    uses:"🔍 「{name}」を材料に使うレシピを探す",recipe:"レシピ",
    wiki:"https://ja.minecraft.wiki/w/Special:Search?search=",wikiLabel:"📖 「{name}」をWikiで詳しく見る",wikiIng:"📖 Wiki",
    sampleMain:"公式サンプルデータ main",loaded:"データ読込済み",updated:"更新 {d}",
    noData:"レシピデータ未生成",
    noDataMsg:"まだレシピデータが作成されていません。GitHubへアップロード後、Actions の「Build recipe database」が完了すると表示されます。",
    error:"エラー：",langBtn:"English",langBtnAria:"Switch to English",
    cat_all:"すべて",cat_building:"建築",cat_equipment:"道具・装備",cat_food:"食料",cat_redstone:"レッドストーン・乗り物",
    cat_materials:"素材",cat_brewing:"醸造",cat_world:"設置・召喚",cat_other:"その他",
    st_world:"ワールドに設置",st_crafting_table:"作業台",st_stonecutter:"石切台",st_furnace:"かまど",st_blast_furnace:"溶鉱炉",
    st_smoker:"燻製器",st_campfire:"焚き火",st_soul_campfire:"魂の焚き火",st_smithing_table:"鍛冶台",st_brewing_stand:"醸造台",
    st_cartography_table:"製図台"
  },
  en:{
    title:"Minecraft Recipe Book",appTitle:"⛏ Minecraft Recipe Book",edition:"Bedrock Edition",
    searchPh:"Search by name or ingredient",searchAria:"Search by item or ingredient name",clearAria:"Clear search",
    stationAria:"Filter by station",allStations:"All stations",catAria:"Categories",loading:"Loading recipes…",
    notice:"* This guide is generated from Mojang's official Bedrock sample data. It covers crafting and processing recipes and is not a list of every item in the game. Items obtained only from drops, trading, or structures, and add-on recipes, are not shown.<br>Recipes may change with game updates. The data date and version are shown at the top right.",
    footer:"Unofficial fan tool. Minecraft is a trademark of Mojang Studios / Microsoft.",
    back:"‹ Back",backAria:"Back to previous recipe",closeAria:"Close",close:"Close",
    other:"Other",listSep:", ",nameSep:", ",stSep:" / ",detailSep:" — ",etc:", etc.",colon:": ",numbered:"{t} ({n})",
    fav:"★ Favorites",recent:"🕘 Recently viewed",clear:"Clear",allItems:"All items",
    groupMake:"Recipes that make \"{q}\" ({n})",groupUse:"Recipes that use \"{q}\" ({n})",
    ways:"{n} ways",special:"Special",specialRecipe:"Special recipe",
    hits:"{n} results",items:"{n} / {t} items",reset:"Clear all filters",empty:"No matching recipes.",
    more:"Show more ({n} left)",
    gridLabel:"Crafting grid (top view)",layoutLabel:"Front view",
    flow_build:"Built by placing blocks in the world. See \"Tips\" below.",
    flow_shapeless:"Shapeless<br>Put the ingredients in any free slots of the crafting grid",flow_process:"Put the ingredients in the {st}",
    flow_brewing:"Add the ingredient to the base in a Brewing Stand",flow_smithing:"Put the template, base, and material in a Smithing Table",
    flow_other:"Made at a special station",
    recipeLink:"Recipe ›",variantsHead:"{n} ways to make (tap to switch)",favAdd:"Add to favorites",favRemove:"Remove from favorites",
    makes:"Makes: {n}",ingHead:"Ingredients",noIng:"No ingredient data (special recipe)",notesHead:"Tips",
    uses:"🔍 Find recipes that use \"{name}\"",recipe:"Recipe",
    wiki:"https://minecraft.wiki/w/Special:Search?search=",wikiLabel:"📖 Read about \"{name}\" on the Wiki",wikiIng:"📖 Wiki",
    sampleMain:"official samples (main)",loaded:"Data loaded",updated:"Updated {d}",
    noData:"Recipe data not generated",
    noDataMsg:"Recipe data has not been generated yet. It will appear after the \"Build recipe database\" GitHub Action finishes.",
    error:"Error: ",langBtn:"日本語",langBtnAria:"日本語に切り替え",
    cat_all:"All",cat_building:"Building",cat_equipment:"Tools & Gear",cat_food:"Food",cat_redstone:"Redstone & Transport",
    cat_materials:"Materials",cat_brewing:"Brewing",cat_world:"Build & Summon",cat_other:"Other",
    st_world:"Placed in world",st_crafting_table:"Crafting Table",st_stonecutter:"Stonecutter",st_furnace:"Furnace",
    st_blast_furnace:"Blast Furnace",st_smoker:"Smoker",st_campfire:"Campfire",st_soul_campfire:"Soul Campfire",
    st_smithing_table:"Smithing Table",st_brewing_stand:"Brewing Stand",st_cartography_table:"Cartography Table"
  }
};
// 文言の取得。{name} などの差し込みは、HTMLに入れる側でエスケープ済みの値を渡す
function T(key,vars){
  let s=I18N[LANG][key]??I18N.ja[key]??key;
  if(vars)for(const [k,v] of Object.entries(vars))s=s.split("{"+k+"}").join(v);
  return s;
}
const DATA_URL=LANG==="ja"?"./data/recipes.json":"./data/recipes.en.json";
const collator=new Intl.Collator(LANG);

const CAT_ORDER=["building","equipment","food","redstone","materials","brewing","world","other"];
const catLabel=c=>I18N[LANG]["cat_"+c]??c;
const stationOrder=["world","crafting_table","stonecutter","furnace","blast_furnace","smoker","campfire","soul_campfire","smithing_table","brewing_stand","cartography_table"];
const stationLabel=s=>(s&&I18N[LANG]["st_"+s])||s||T("other");

function applyStatic(){
  document.documentElement.lang=LANG;
  document.title=T("title");
  $("#appTitle").textContent=T("appTitle");
  $("#version").textContent=T("edition");
  $("#search").placeholder=T("searchPh");
  $("#search").setAttribute("aria-label",T("searchAria"));
  $("#clear").setAttribute("aria-label",T("clearAria"));
  $("#station").setAttribute("aria-label",T("stationAria"));
  $("#filters").setAttribute("aria-label",T("catAria"));
  $("#count").textContent=T("loading");
  $("#notice").innerHTML=T("notice");
  $("#footer").textContent=T("footer");
  $("#sheetBack").textContent=T("back");
  $("#sheetBack").setAttribute("aria-label",T("backAria"));
  $("#sheetClose").setAttribute("aria-label",T("closeAria"));
  const lb=$("#langBtn");
  lb.textContent=T("langBtn");lb.setAttribute("aria-label",T("langBtnAria"));lb.lang=LANG==="ja"?"en":"ja";
}
// 切り替えた言語を保存して読み直す（検索語は言語が違うと当たらないので消す。カテゴリ・作業場所は維持）
function switchLang(){
  const next=LANG==="ja"?"en":"ja";
  try{localStorage.setItem("mcr.lang",next);}catch(e){}
  const p=new URLSearchParams(location.hash.slice(1));p.delete("q");
  const h=p.toString();
  try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search);}catch(e){}
  location.reload();
}

// 検索用の正規化：全角半角・大文字小文字・ひらがな/カタカナの違いを吸収
function norm(s){
  return String(s??"").normalize("NFKC").toLowerCase()
    .replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))
    .replace(/[・･]/g,"");
}
// Wikiリンク（言語ごとに日本語版／英語版のWikiを使う）
// 「板材（各種）」「Planks (any)」「エンドポータル（起動）」の末尾の補足は外して検索する（記事名に一致しやすくする）
const wikiTerm=name=>String(name).replace(/\s*[（(][^（）()]*[）)]\s*$/,"").trim()||String(name);
const wikiURL=name=>T("wiki")+encodeURIComponent(wikiTerm(name));
const extA=(href,label,cls="ext")=>`<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
function extLinksHTML(name){
  return `<div class="extlinks">${extA(wikiURL(name),T("wikiLabel",{name}))}</div>`;
}
const isMulti=name=>/／| \/ /.test(String(name));
const idWords=s=>String(s||"").replace(/^#?(minecraft:)?/,"").replace(/[_:]/g," ");

let all=[], itemCount=0, byKey=new Map(), byId=new Map(), byName=new Map(), byOutId=new Map();
let q="", cat="all", st="", limit=PAGE;
let timer=null;

/* ---------------------------------------------------------------- 検索・一覧 */
function prepare(){
  all.sort((a,b)=>collator.compare(a.name,b.name)||String(a.id).localeCompare(String(b.id)));
  byId.clear();byName.clear();byOutId.clear();
  for(const r of all){
    r.stations=r.stations||[];r.ingredients=r.ingredients||[];
    r._n=norm(r.output||r.name);
    r._o=norm((r.output||r.name)+" "+(r.outputId?idWords(r.outputId):""));
    r._h=norm([r._o,...r.ingredients.map(x=>x.name+" "+idWords(x.id)),...r.stations.map(stationLabel),r.typeLabel||""].join(" "));
    byId.set(r.id,r);
    (byName.get(r.name)||byName.set(r.name,[]).get(r.name)).push(r);
    if(r.outputId)(byOutId.get(r.outputId)||byOutId.set(r.outputId,[]).get(r.outputId)).push(r);
  }
  const rank=r=>{const i=stationOrder.indexOf(r.stations[0]);return i<0?99:i;};
  for(const m of [byName,byOutId])for(const list of m.values())list.sort((a,b)=>rank(a)-rank(b));
  byKey.clear();
  for(const r of all){const k=keyOf(r);if(!byKey.has(k))byKey.set(k,variantsOf(r)[0]);}
  itemCount=byKey.size;
}

/* ---------------------------------------------------------------- 最近見た・お気に入り（端末内に保存） */
const RECENT_MAX=12;
function loadList(key){try{const v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[];}catch(e){return [];}}
function saveList(key,list){try{localStorage.setItem(key,JSON.stringify(list));}catch(e){}}
let recent=loadList("mcr.recent"),favs=loadList("mcr.fav"),listDirty=false;
function addRecent(r){
  const k=keyOf(r);
  recent=[k,...recent.filter(x=>x!==k)].slice(0,RECENT_MAX);
  saveList("mcr.recent",recent);listDirty=true;
}
const isFav=r=>favs.includes(keyOf(r));
function toggleFav(r){
  const k=keyOf(r);
  favs=isFav(r)?favs.filter(x=>x!==k):[k,...favs];
  saveList("mcr.fav",favs);listDirty=true;
}
function quickHTML(){
  const row=(title,keys,act)=>{
    const items=keys.map(k=>byKey.get(k)).filter(Boolean);
    if(!items.length)return "";
    const clear=act?`<button class="link" type="button" data-act="${act}">${esc(T("clear"))}</button>`:"";
    return `<div class="quick"><div class="qhead"><span>${esc(title)}</span>${clear}</div><div class="qrow">${items.map(r=>`<button class="qitem" type="button" data-id="${esc(r.id)}"><span aria-hidden="true">${esc(r.emoji||"🧱")}</span>${esc(r.name)}</button>`).join("")}</div></div>`;
  };
  const h=row(T("fav"),favs,"")+row(T("recent"),recent,"clearRecent");
  return h?h+`<div class="grouphead">${esc(T("allItems"))}</div>`:"";
}
function nameScore(r,tokens){
  let s=0;
  for(const t of tokens){
    if(r._n===t)s+=0;else if(r._n.startsWith(t))s+=1;else if(r._n.includes(t))s+=2;else s+=3;
  }
  return s;
}
function computeView(){
  const pool=all.filter(r=>(cat==="all"||r.category===cat)&&(!st||r.stations.includes(st)));
  const tokens=norm(q).split(/\s+/).filter(Boolean);
  if(!tokens.length){const rows=collapse(pool);return {groups:[{title:"",rows}],total:rows.length,searching:false};}
  const main=[],uses=[];
  for(const r of pool){
    if(tokens.every(t=>r._o.includes(t)))main.push([nameScore(r,tokens),r]);
    else if(tokens.every(t=>r._h.includes(t)))uses.push(r);
  }
  main.sort((a,b)=>a[0]-b[0]);
  const q0=q.trim(),groups=[];
  const mi=collapse(main.map(x=>x[1])),ui=collapse(uses);
  if(mi.length)groups.push({title:ui.length?T("groupMake",{q:q0,n:mi.length}):"",rows:mi});
  if(ui.length)groups.push({title:T("groupUse",{q:q0,n:ui.length}),rows:ui});
  return {groups,total:mi.length+ui.length,searching:true};
}
// 同じ完成品のレシピを1件にまとめる（材料違い・作業場所違いの別レシピ）
const keyOf=r=>r.outputId||"n:"+r.name;
function collapse(rows){
  const m=new Map();
  for(const r of rows){const k=keyOf(r),e=m.get(k);if(e)e.list.push(r);else m.set(k,{r,list:[r]});}
  return [...m.values()];
}
function variantsOf(r){return (r.outputId&&byOutId.get(r.outputId))||byName.get(r.name)||[r];}
// 各レシピの「他と違う部分」を短いラベルにする（全レシピ共通の材料は省く）
function variantLabels(list){
  const names=list.map(r=>[...new Set(r.ingredients.map(x=>x.name))]);
  const common=names[0].filter(n=>names.every(a=>a.includes(n)));
  const multiSt=new Set(list.map(stationsOf)).size>1;
  const labels=list.map((r,i)=>{
    const d=names[i].filter(n=>!common.includes(n));
    let t=d.slice(0,2).join(T("nameSep"))+(d.length>2?T("etc"):"");
    if(multiSt)t=stationsOf(r)+(t?T("colon")+t:"");
    return t||stationsOf(r);
  });
  const seen=new Map();
  return labels.map(t=>{const n=(seen.get(t)||0)+1;seen.set(t,n);return labels.filter(x=>x===t).length>1?T("numbered",{t,n}):t;});
}
function ingSummary(r){
  const t=r.ingredients.slice(0,5).map(x=>x.name+(x.count!=null&&x.count!=1?"×"+x.count:"")).join(T("listSep"));
  return t+(r.ingredients.length>5?T("etc"):"");
}
function cardHTML({r,list}){
  const n=list.length;
  const st=[...new Set(list.flatMap(x=>x.stations))].map(stationLabel).join(T("stSep"))||T("special");
  const cnt=(r.outputCount||1)>1&&n===1?`<span class="cnt">×${esc(r.outputCount)}</span>`:"";
  const badge=n>1?`<span class="vcnt">${esc(T("ways",{n}))}</span>`:"";
  let detail=ingSummary(r);
  if(n>1){const l=variantLabels(list);detail=l.slice(0,3).join(T("listSep"))+(n>3?T("etc"):"");}
  return `<button class="recipe" type="button" data-id="${esc(r.id)}"><span class="icon" aria-hidden="true">${esc(r.emoji||"🧱")}</span><span class="rbody"><span class="rname">${esc(r.name)}${cnt}${badge}</span><span class="details">${esc(st)}${esc(T("detailSep"))}${esc(detail)}</span></span><span class="arrow" aria-hidden="true">›</span></button>`;
}
function render(opts={}){
  if(opts.resetLimit!==false)limit=PAGE;
  const v=computeView();
  const filtered=!!(q.trim()||cat!=="all"||st);
  const nf=n=>n.toLocaleString(LANG);
  $("#count").textContent=v.searching?T("hits",{n:nf(v.total)}):T("items",{n:nf(v.total),t:nf(itemCount)});
  const resetBtn=`<button class="link" type="button" data-act="reset">${esc(T("reset"))}</button>`;
  $("#resetwrap").innerHTML=filtered?resetBtn:"";
  $("#clear").hidden=!q;
  if(!v.total){
    $("#cards").innerHTML=`<div class="empty">${esc(T("empty"))}<br>${filtered?resetBtn:""}</div>`;
    return;
  }
  let left=limit,html=filtered?"":quickHTML();
  listDirty=false;
  for(const g of v.groups){
    if(left<=0)break;
    if(g.title)html+=`<div class="grouphead">${esc(g.title)}</div>`;
    const slice=g.rows.slice(0,left);
    html+=slice.map(cardHTML).join("");
    left-=slice.length;
  }
  if(v.total>limit)html+=`<button class="morebtn" type="button" data-act="more">${esc(T("more",{n:nf(v.total-limit)}))}</button>`;
  $("#cards").innerHTML=html;
}
function renderFilters(){
  $("#filters").innerHTML=categoryList.map(c=>`<button type="button" class="${c===cat?"active":""}" aria-pressed="${c===cat}" data-cat="${esc(c)}">${esc(catLabel(c))}</button>`).join("");
}
// 絞り込み後は先頭の結果が検索バーのすぐ下に来るようにスクロール
function toResults(){
  const tb=$("#toolbar").getBoundingClientRect().bottom;
  const mt=$("#meta").getBoundingClientRect().top;
  if(mt<tb)window.scrollBy(0,mt-tb-6);
}
function saveState(){
  const p=new URLSearchParams();
  if(q)p.set("q",q);if(cat!=="all")p.set("c",cat);if(st)p.set("s",st);
  const h=p.toString();
  try{history.replaceState(history.state,"",h?"#"+h:location.pathname+location.search);}catch(e){}
}
function applyFilters(){saveState();render();toResults();}
function resetAll(){q="";cat="all";st="";$("#search").value="";$("#station").value="";renderFilters();applyFilters();}

/* ---------------------------------------------------------------- 詳細シート */
let sheetOpen=false,pushed=false,stack=[],lastFocus=null;
const root=$("#sheetRoot");

function recipesFor(ing,self){
  if(!ing||!ing.name||String(ing.id||"").startsWith("#"))return [];
  const list=(ing.id&&byOutId.get(ing.id))||byName.get(ing.name)||[];
  return list.filter(x=>x!==self);
}
function sheetHTML(r){
  const stations=stationsOf(r);
  let visual;
  if(r.grid&&r.grid.some(Boolean)){
    visual=`<div><div class="craftgrid">${Array.from({length:9},(_,i)=>{const v=r.grid[i]||"";return `<div class="cell ${v?"":"blank"}">${esc(v)}</div>`;}).join("")}</div><div class="gridlabel">${esc(T("gridLabel"))}</div></div>`;
  }else if(r.layout&&r.layout.cells){
    // 召喚・ポータルなど：ワールドに並べる形（列数は可変）
    const L=r.layout;
    const c=+L.cols||1,rw=+L.rows||1,opt=new Set(L.optional||[]);
    visual=`<div><div class="craftgrid" style="grid-template-columns:repeat(${c},1fr);aspect-ratio:${c}/${rw};width:min(100%,${c*50}px);margin:0 auto">${L.cells.map((v,i)=>`<div class="cell ${opt.has(i)?"opt":v?"":"blank"}">${esc(v)}</div>`).join("")}</div><div class="gridlabel">${esc(L.caption||T("layoutLabel"))}</div></div>`;
  }else{
    // flow_* の文言はHTML（<br>）を含むので、差し込む値だけエスケープする
    const known=["build","shapeless","process","brewing","smithing"].includes(r.type);
    const text=known?T("flow_"+r.type,{st:esc(stations)}):esc(T("flow_other"));
    visual=`<div class="flowbox">${text}</div>`;
  }
  const ings=r.ingredients.map((x,i)=>{
    const role=x.role?`<span class="role">${esc(x.role)}</span>`:"";
    const body=`${role}<span class="iname">${esc(x.name)}</span><span class="iqty">× ${esc(x.count||1)}</span>`;
    if(recipesFor(x,r).length)return `<li><button class="ing" type="button" data-ing="${i}">${body}<span class="go">${esc(T("recipeLink"))}</span></button></li>`;
    // クラフトできない材料（タグ・複数候補の材料を除く）には Wiki へのリンクを付ける
    const get=x.name&&!String(x.id||"").startsWith("#")&&!isMulti(x.name)?extA(wikiURL(x.name),T("wikiIng"),"ilink"):"";
    return `<li><div class="ing static">${body}${get}</div></li>`;
  }).join("");
  // 同じ完成品の別レシピは、チップで切り替える
  const vars=variantsOf(r);
  let varsHTML="";
  if(vars.length>1){
    const labels=variantLabels(vars);
    varsHTML=`<div class="vsec"><div class="sec">${esc(T("variantsHead",{n:vars.length}))}</div><div class="vchips">${vars.map((x,i)=>`<button class="vchip${x===r?" active":""}" type="button" data-var="${esc(x.id)}" aria-pressed="${x===r}">${esc(labels[i])}</button>`).join("")}</div></div>`;
  }
  const fav=isFav(r);
  const favBtn=`<button class="favbtn" type="button" data-act="fav" aria-pressed="${fav}" aria-label="${esc(T(fav?"favRemove":"favAdd"))}">${fav?"★":"☆"}</button>`;
  return `<div class="detailhead"><span class="icon" aria-hidden="true">${esc(r.emoji||"🧱")}</span><div><h2 id="sheetTitle">${esc(r.name)}</h2><div class="muted">${esc(T("makes",{n:r.outputCount||1}))}${esc(T("detailSep"))}${esc(stations)}</div></div>${favBtn}</div>
<div class="pills">${r.stations.map(s=>`<span class="pill">${esc(stationLabel(s))}</span>`).join("")}<span class="pill">${esc(r.typeLabel||r.type||T("recipe"))}</span></div>
${varsHTML}
<div class="detailgrid"><div><div class="sec">${esc(T("ingHead"))}</div><ul class="ingredients">${ings||`<li><div class="ing static">${esc(T("noIng"))}</div></li>`}</ul></div>${visual}</div>
${Array.isArray(r.notes)&&r.notes.length?`<div class="notes"><div class="sec">${esc(T("notesHead"))}</div><ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}
<button class="act" type="button" data-act="uses">${esc(T("uses",{name:r.name}))}</button>
${extLinksHTML(r.name)}
<button class="act sub2" type="button" data-act="close">${esc(T("close"))}</button>`;
}
function stationsOf(r){return r.stations.map(stationLabel).join(T("stSep"))||T("specialRecipe");}
function renderSheet(keepScroll){
  const r=stack[stack.length-1],body=$("#sheetBody"),y=body.scrollTop;
  const vy=keepScroll&&body.querySelector(".vchips")?body.querySelector(".vchips").scrollTop:0;
  body.innerHTML=sheetHTML(r);
  body.scrollTop=keepScroll?y:0;
  if(vy&&body.querySelector(".vchips"))body.querySelector(".vchips").scrollTop=vy;
  $("#sheetBack").hidden=stack.length<2;
}
function openSheet(r,trigger){
  if(!r)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur(); // iOSのキーボードを閉じる
  if(!sheetOpen){
    sheetOpen=true;lastFocus=trigger||null;stack=[r];
    root.classList.add("open");document.documentElement.classList.add("lock");
    try{history.pushState({sheet:1},"");pushed=true;}catch(e){pushed=false;}
  }else stack.push(r);
  addRecent(r);
  renderSheet();
  $("#sheetClose").focus({preventScroll:true});
}
function closeSheet(fromPop){
  if(!sheetOpen)return;
  sheetOpen=false;stack=[];
  root.classList.remove("open");document.documentElement.classList.remove("lock");
  $("#sheet").style.transform="";
  if(pushed&&!fromPop){pushed=false;try{history.back();}catch(e){}}else pushed=false;
  // 履歴・お気に入りが変わっていたら、背面の一覧（ホームの上部）を更新
  if(listDirty)render({resetLimit:false});
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});
}
window.addEventListener("popstate",()=>{if(sheetOpen)closeSheet(true);else saveState();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheetOpen){closeSheet();return;}
  if(e.key==="/"&&!sheetOpen&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();$("#search").focus();}
});
$("#backdrop").addEventListener("click",()=>closeSheet());
$("#sheetClose").addEventListener("click",()=>closeSheet());
$("#sheetBack").addEventListener("click",()=>{if(stack.length>1){stack.pop();renderSheet();}});
$("#sheetBody").addEventListener("click",e=>{
  const cur=stack[stack.length-1];
  const ing=e.target.closest("[data-ing]");
  if(ing){const x=cur.ingredients[+ing.dataset.ing];const list=recipesFor(x,cur);if(list.length)openSheet(list[0]);return;}
  // 別レシピへの切り替えは履歴に積まず、その場で差し替える
  const vb=e.target.closest("[data-var]");
  if(vb){const x=byId.get(vb.dataset.var);if(x&&x!==cur){stack[stack.length-1]=x;renderSheet(true);}return;}
  const act=e.target.closest("[data-act]");
  if(!act)return;
  if(act.dataset.act==="close")closeSheet();
  if(act.dataset.act==="fav"){toggleFav(cur);renderSheet(true);}
  if(act.dataset.act==="uses"){
    const name=cur.name;closeSheet();
    q=name;cat="all";st="";$("#search").value=q;$("#station").value="";renderFilters();
    setTimeout(()=>{applyFilters();window.scrollTo(0,0);},30);
  }
});
// 下スワイプで閉じる
(()=>{
  const bar=$("#sheetbar"),sheet=$("#sheet");let y0=null,dy=0;
  bar.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;sheet.style.transition="none";},{passive:true});
  bar.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sheet.style.transform=`translateY(${dy}px)`;},{passive:true});
  bar.addEventListener("touchend",()=>{if(y0==null)return;sheet.style.transition="";y0=null;if(dy>90)closeSheet();else sheet.style.transform="";});
})();

/* ---------------------------------------------------------------- 入力イベント */
$("#cards").addEventListener("click",e=>{
  const act=e.target.closest("[data-act]");
  if(act){
    if(act.dataset.act==="more"){limit+=PAGE;render({resetLimit:false});}
    if(act.dataset.act==="reset")resetAll();
    if(act.dataset.act==="clearRecent"){recent=[];saveList("mcr.recent",recent);render({resetLimit:false});}
    return;
  }
  const b=e.target.closest(".recipe,.qitem");
  if(b)openSheet(byId.get(b.dataset.id),b);
});
$("#resetwrap").addEventListener("click",e=>{if(e.target.closest("[data-act=reset]"))resetAll();});
$("#filters").addEventListener("click",e=>{
  const b=e.target.closest("button[data-cat]");if(!b)return;
  cat=b.dataset.cat;renderFilters();applyFilters();
});
$("#station").addEventListener("change",e=>{st=e.target.value;applyFilters();});
$("#search").addEventListener("input",e=>{
  q=e.target.value;$("#clear").hidden=!q;
  clearTimeout(timer);timer=setTimeout(applyFilters,60);
});
$("#search").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur();}}); // 検索キーでキーボードを閉じて結果を見やすく
$("#clear").addEventListener("click",()=>{q="";$("#search").value="";$("#search").focus();applyFilters();});

/* ---------------------------------------------------------------- 初期化 */
let categoryList=["all"];
async function init(){
  applyStatic();
  $("#station").innerHTML=`<option value="">${esc(T("allStations"))}</option>`;
  try{
    const res=await fetch(DATA_URL,{cache:"no-store"});
    if(!res.ok)throw new Error(`${DATA_URL} (HTTP ${res.status})`);
    const data=await res.json();
    all=data.recipes||[];prepare();
    const present=new Set(all.map(r=>r.category));
    categoryList=["all",...CAT_ORDER.filter(c=>present.has(c)),...[...present].filter(c=>!CAT_ORDER.includes(c))];
    const stations=[...new Set(all.flatMap(r=>r.stations))].sort((a,b)=>stationOrder.indexOf(a)-stationOrder.indexOf(b));
    $("#station").innerHTML=`<option value="">${esc(T("allStations"))}</option>`+stations.map(s=>`<option value="${esc(s)}">${esc(stationLabel(s))}</option>`).join("");
    const v=[`Bedrock ${data.gameVersion||T("sampleMain")}`];
    if(data.generatedAt)v.push(T("updated",{d:data.generatedAt.replace(" UTC","")}));
    $("#version").innerHTML=v.map(esc).join("<br>");
    // 前回の検索条件（URLのハッシュ）を復元
    const p=new URLSearchParams(location.hash.slice(1));
    q=p.get("q")||"";cat=categoryList.includes(p.get("c"))?p.get("c"):"all";st=stations.includes(p.get("s"))?p.get("s"):"";
    $("#search").value=q;$("#station").value=st;
    renderFilters();render();
  }catch(e){
    $("#count").textContent=T("noData");
    $("#cards").innerHTML=`<div class="empty">${esc(T("noDataMsg"))}<br><br>${esc(T("error"))}${esc(e.message)}</div>`;
    renderFilters();
  }
}
$("#langBtn").addEventListener("click",switchLang);
init();

if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  // 新しいService Workerに切り替わったら一度だけ自動で再読み込みして最新UIにする
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController&&!reloaded&&!sheetOpen){reloaded=true;location.reload();}});
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
})();
</script>
</body>
</html>
